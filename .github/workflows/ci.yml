# Runs every check of OIO in parallel: the tests, Plugin Check and the
# Windows run, each in its own workflow. On each push to dev, main or a
# hotfix branch and each pull request, and by the release workflow
# before it publishes the release: release-it only starts once it
# passed (tools/release/check-ci.sh).
name: CI

on:
  push:
    branches:
      - dev
      - main
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  plugin-check:
    uses: ./.github/workflows/plugin-check.yml

  windows:
    uses: ./.github/workflows/windows.yml
