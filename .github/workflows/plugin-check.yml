# Runs Plugin Check, the checks of the WordPress.org plugin review, on
# the zip of the release: the files a site gets. Run by the release
# workflow before it publishes the release, or by hand from the Actions
# tab, not at each push: it starts a whole WordPress.
name: Plugin Check

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Composer runs Strauss, which builds vendor-prefixed/.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      # Bun installs the dependencies and runs the scripts, Node.js runs
      # @wordpress/scripts and release-it, which need Node.js 22.22.2,
      # 24.15.0 or later.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install the dependencies
        run: bun install --frozen-lockfile

      # composer install, license check, then plugin-zip.
      - name: Build the zip
        run: bun run release:zip

      # The zip holds the octopus-image-optimizer folder: its name is the slug.
      - name: Unzip the plugin
        run: unzip -q octopus-image-optimizer.zip -d build

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/octopus-image-optimizer
