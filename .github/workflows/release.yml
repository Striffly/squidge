# Builds the zip of the plugin and publishes the GitHub release when
# `bun run release` pushes a version tag, once the CI workflow passes
# again on it, then deploys it to the SVN of WordPress.org.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    # Read by the deploy step: without them, before the plugin is
    # approved on WordPress.org, it is skipped.
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Composer runs Strauss, which builds vendor-prefixed/.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      # Bun installs the dependencies and runs the scripts, Node.js runs
      # @wordpress/scripts and release-it, which need Node.js 22.22.2,
      # 24.15.0 or later.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install the dependencies
        run: bun install --frozen-lockfile

      # composer install, license check, then plugin-zip.
      - name: Build the zip
        run: bun run release:zip

      # The zip keeps its name, so that
      # releases/latest/download/octopus-image-optimizer.zip always works.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" octopus-image-optimizer.zip \
            --verify-tag \
            --title "Release $TAG" \
            --generate-notes \
            "${prerelease[@]}"

      # trunk and the tag of the version on WordPress.org, from the files
      # of the zip, and the banners, icons and screenshots of
      # .wordpress-org/. The pre-releases stay on GitHub.
      - name: Unzip the plugin
        if: ${{ env.SVN_USERNAME != '' && !contains(github.ref_name, '-') }}
        run: unzip -q octopus-image-optimizer.zip -d build

      - name: Deploy to WordPress.org
        if: ${{ env.SVN_USERNAME != '' && !contains(github.ref_name, '-') }}
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: octopus-image-optimizer
          BUILD_DIR: build/octopus-image-optimizer
