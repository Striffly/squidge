# Checks the code with the WordPress Coding Standards, and runs the
# integration tests on the oldest and the newest PHP version OIO
# supports, on a single site and on a network, with the libraries
# installed. Also run by the release workflow before it builds the zip.
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  OXIPNG_VERSION: 10.2.1
  OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17

jobs:
  # The security and translation checks of the WordPress Coding Standards,
  # and the compatibility with the PHP versions OIO supports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install the dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS
        run: composer lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        multisite: [false, true]
    name: PHP ${{ matrix.php }}${{ matrix.multisite && ', multisite' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mysqli, fileinfo
          tools: composer
          coverage: none

      # oxipng is not packaged by Ubuntu: its static build, from its release.
      - name: Install the libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends webp libavif-bin jpegoptim optipng pngquant
          curl -fsSL -o "$RUNNER_TEMP/oxipng.tar.gz" "https://github.com/shssoichiro/oxipng/releases/download/v$OXIPNG_VERSION/oxipng-$OXIPNG_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$OXIPNG_SHA256  $RUNNER_TEMP/oxipng.tar.gz" | sha256sum -c --quiet -
          sudo tar -xzf "$RUNNER_TEMP/oxipng.tar.gz" -C /usr/local/bin --strip-components=1 "oxipng-$OXIPNG_VERSION-x86_64-unknown-linux-musl/oxipng"
          for library in cwebp avifenc jpegoptim optipng oxipng pngquant; do
            command -v "$library"
          done

      # MySQL comes with the runner, stopped, with root / root.
      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e 'CREATE DATABASE wordpress_test'

      # The dependencies of OIO (Strauss), PHPUnit and WordPress.
      - name: Install the dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the tests
        env:
          WP_TESTS_DB_PASSWORD: root
        run: composer ${{ matrix.multisite && 'test:multisite' || 'test' }}
